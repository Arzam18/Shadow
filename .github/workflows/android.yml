name: Build Shadow Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/android.yml'
      - 'quantised.bin'
      - 'nnue_data.h'

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 with NEON
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install the NDK directly; do not run setup-android/sdkmanager,
      # whose attempt to install the retired "tools" package caused the failure.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build Shadow for Android arm64-v8a
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "Android NDK path was not provided by setup-ndk." >&2
            env | grep -E 'ANDROID_NDK|NDK_HOME' || true
            exit 1
          fi

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          test -x "$CXX"
          mkdir -p dist

          "$CXX" \
            -std=c++17 \
            -O3 \
            -DNDEBUG \
            -march=armv8-a+simd \
            -mtune=cortex-a53 \
            -flto \
            -pthread \
            src/*.cpp \
            -o dist/Shadow

          chmod 755 dist/Shadow
          file dist/Shadow
          "$TOOLCHAIN/llvm-readelf" -h dist/Shadow | grep -E 'Class:|Machine:'
          "$TOOLCHAIN/llvm-readelf" -d dist/Shadow | grep NEEDED || true

      - name: Package NNUE network if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f quantised.bin ]; then
            cp quantised.bin dist/
          else
            echo "quantised.bin is absent. The engine may need its compatible NNUE network supplied separately unless it is embedded in the source."
          fi
          if [ -f nnue_data.h ]; then
            echo "Found nnue_data.h."
          fi
          cat > dist/README.txt <<'EOF_README'
          Shadow Android ARM64 build
          Target: Android arm64-v8a, API 24+
          CPU: ARMv8-A Advanced SIMD (NEON)
          The executable is named Shadow. If the NNUE network is not embedded,
          place the compatible quantised.bin file in the engine's working directory.
          EOF_README

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Android-arm64-v8a
          path: dist/
          if-no-files-found: error
          retention-days: 30
